version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-doctor-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootuser
      MYSQL_DATABASE: DoctorDb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: